[tool.poetry]
name = "cfreal-ending"
version = "0.1.0"
description = "SQL injection framework"
authors = ["Charles \"cfreal\" Fol <folcharles@gmail.com>"]
readme = "README.md"
license = "AGPLv3"
homepage = "https://github.com/cfreal/ending"
repository = "https://github.com/cfreal/ending"
packages = [
    { include = "ending" }
]

[tool.poetry.dependencies]
python = "^3.12"
rich = "^13.9.4"
requests = "^2.32.3"
urllib3 = "^2.3.0"
aiohttp = "^3.12.15"


[tool.poetry.group.dev.dependencies]
docker = "^7.1.0"
pyodbc = "^5.2.0"
oracledb = "^2.5.1"
mysql-connector-python = "^9.1.0"
black = "^24.10.0"
psycopg2-binary = "^2.9.10"


[tool.poetry.group.doc.dependencies]
pdoc = "^16.0.0"
mkdocs = "^1.6.1"

[tool.poetry.scripts]
ending = "ending.cli.parse:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
